name: 发布安装包

# 推送 v* tag 时打包三平台安装包并发布到 GitHub Release；
# 也支持手动触发（仅产出构建产物，不发 Release）。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 解析产物版本号：tag 形如 v0.1.1，手动触发时退回 tauri.conf.json 里的版本
  prepare:
    name: 解析版本号
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: ver
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) version="${GITHUB_REF_NAME#v}" ;;
            *) version=$(node -p "require('./src-tauri/tauri.conf.json').version") ;;
          esac
          echo "产物版本号: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  linux:
    name: Linux (AppImage + deb + rpm)
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            build-essential \
            curl wget file \
            libfuse2

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: linux-amd64

      - run: pnpm install --frozen-lockfile

      - name: 打包
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          # AppImage 运行时挂载需要 FUSE，CI 上改用解包方式运行更稳
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: bash scripts/ci/run-build.sh bash scripts/build.sh --bundles appimage,deb,rpm --config "{\"version\":\"$VERSION\"}"

      - uses: actions/upload-artifact@v4
        with:
          name: TeaCoder-linux-x64
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm

      - name: 上传构建日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-linux
          path: |
            build.log
            build-error.txt
          if-no-files-found: ignore

  macos:
    name: macOS (dmg)
    needs: prepare
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: macos-universal

      - run: pnpm install --frozen-lockfile

      # bundle_dmg.sh 内部靠 head/grep/sed 等系统命令定位挂载点，
      # PATH 里若有第三方同名命令会劫持解析，强制系统目录排在最前
      - name: 固定系统命令路径
        run: echo "/usr/bin:/bin:/usr/sbin:/sbin" >> "$GITHUB_PATH"

      # 编译与打包拆成两步：步骤结论能直接指出失败发生在哪一段，
      # 不用登录就能从运行页看到
      - name: 构建前端
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: pnpm build

      - name: 编译 universal
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: bash scripts/ci/run-build.sh pnpm tauri build --target universal-apple-darwin --no-bundle --config "{\"version\":\"$VERSION\"}"

      - name: 打包 dmg
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: bash scripts/ci/run-build.sh pnpm tauri build --target universal-apple-darwin --bundles dmg --config "{\"version\":\"$VERSION\"}"

      - uses: actions/upload-artifact@v4
        with:
          name: TeaCoder-macos-universal
          if-no-files-found: error
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

      # 构建日志单独成件：既能留档，也方便排查时取用
      - name: 上传构建日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-macos
          path: |
            build.log
            build-error.txt
          if-no-files-found: ignore

  windows:
    name: Windows (msi + nsis)
    needs: prepare
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: windows-msvc

      - run: pnpm install --frozen-lockfile

      - name: 打包
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: bash scripts/ci/run-build.sh pnpm tauri build --target x86_64-pc-windows-msvc --bundles msi,nsis --config "{\"version\":\"$VERSION\"}"

      - uses: actions/upload-artifact@v4
        with:
          name: TeaCoder-windows-x64
          if-no-files-found: error
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe

      - name: 上传构建日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-windows
          path: |
            build.log
            build-error.txt
          if-no-files-found: ignore

  # 构建诊断：失败原因写进公开 Issue。
  # CI 步骤日志要登录才能看，而 Issue 永远公开，也不依赖发布流程是否成功。
  diagnostics:
    name: 发布构建诊断
    needs: [linux, macos, windows]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 下载构建日志
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: 'build-logs-*'
          path: logs

      - name: 发布诊断
        env:
          REPO: ${{ github.repository }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOG_DIR: logs
        run: bash scripts/ci/publish-diagnostics.sh

  release:
    name: 发布到 GitHub Release
    needs: [linux, macos, windows, diagnostics]
    # 某个平台失败时仍发布其余平台的产物：一次平台故障不该卡住整个发布
    if: always() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      # 发布说明的模板文件在仓库里，发布脚本要从工作目录读它
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: 'TeaCoder-*'
          path: dist
          merge-multiple: true

      # 构建日志单独取，失败时把错误摘要附到发布说明末尾
      - name: 下载构建日志
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: 'build-logs-*'
          path: logs

      - name: 列出产物
        run: ls -l dist

      - name: 发布
        env:
          REPO: ${{ github.repository }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: bash scripts/ci/release.sh
